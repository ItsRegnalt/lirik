name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html style.css app.js audio.js editor.js writing.js writing-ui.js turkish.js lexicon.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png inter-variable.woff2 Inter-OFL.txt Zemberek-LICENSE.txt THIRD_PARTY.md _site/
          cp -r sounds _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Keep only the current deployment
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {...repo, environment: 'github-pages', per_page: 100});
            const current = deployments.find(d => d.sha === context.sha);
            if (!current) throw new Error('Current deployment not found; cleanup skipped');
            for (const d of deployments) {
              if (d.id === current.id) continue;
              await github.rest.repos.createDeploymentStatus({...repo, deployment_id: d.id, state: 'inactive'});
              await github.rest.repos.deleteDeployment({...repo, deployment_id: d.id});
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...repo, status: 'completed', per_page: 100});
            for (const run of runs) {
              if (run.id !== context.runId && ['Pages', 'pages build and deployment'].includes(run.name)) {
                await github.rest.actions.deleteWorkflowRun({...repo, run_id: run.id});
              }
            }
